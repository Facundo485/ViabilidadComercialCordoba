[project]
name = "viabilidad"
version = "0.1.0"
description = "Índice de viabilidad comercial para Córdoba Capital"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
    "lifelines>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viabilidad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: variables sin usar, imports muertos
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplificaciones
    "RET",      # returns: incluye el código inalcanzable que ya nos mordió
    "PD",       # pandas-vet
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Los tests comparan con valores literales y usan fixtures por nombre.
"tests/*" = ["S101", "PLR2004"]
