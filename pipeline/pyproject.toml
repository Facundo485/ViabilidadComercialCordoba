[project]
name = "viabilidad"
version = "0.1.0"
description = "Índice de viabilidad comercial para Córdoba Capital"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viabilidad"]
